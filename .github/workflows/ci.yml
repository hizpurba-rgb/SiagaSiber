name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: bun turbo typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SIAGA_DISABLE_SHARE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Configure git identity
        # Some tests create throwaway git repos and commit into them; a fresh
        # CI runner has no git user configured, so `git commit` would exit 128.
        run: |
          git config --global user.email "ci@siagasiber.local"
          git config --global user.name "SiagaSiber CI"
      - name: Run tests
        run: bun turbo test
