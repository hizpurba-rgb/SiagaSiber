id = "siaga"
name = "SiagaSiber"
description = "The open source coding agent."
version = "1.1.16"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/siagasiber/SiagaSiber"

[agent_servers.siaga]
name = "SiagaSiber"
icon = "./icons/siaga.svg"

[agent_servers.siaga.targets.darwin-aarch64]
archive = "https://github.com/siagasiber/SiagaSiber/releases/download/v1.1.16/siaga-darwin-arm64.zip"
cmd = "./siaga"
args = ["acp"]

[agent_servers.siaga.targets.darwin-x86_64]
archive = "https://github.com/siagasiber/SiagaSiber/releases/download/v1.1.16/siaga-darwin-x64.zip"
cmd = "./siaga"
args = ["acp"]

[agent_servers.siaga.targets.linux-aarch64]
archive = "https://github.com/siagasiber/SiagaSiber/releases/download/v1.1.16/siaga-linux-arm64.tar.gz"
cmd = "./siaga"
args = ["acp"]

[agent_servers.siaga.targets.linux-x86_64]
archive = "https://github.com/siagasiber/SiagaSiber/releases/download/v1.1.16/siaga-linux-x64.tar.gz"
cmd = "./siaga"
args = ["acp"]

[agent_servers.siaga.targets.windows-x86_64]
archive = "https://github.com/siagasiber/SiagaSiber/releases/download/v1.1.16/siaga-windows-x64.zip"
cmd = "./siaga.exe"
args = ["acp"]
